name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:        # the PicoMEM image by hand, as an artifact

permissions:
  contents: write           # the release for a tag

jobs:
  dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The release's version, from the tag (v0.6 -> 0.6)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: The third-party pieces are what the repository says they are
        run: make check-third-party

      - name: Open Watcom V2 (host tools for Linux, the release the Makefile pins)
        run: make toolchain

      - name: Build the DOS side
        run: make dist

      - name: The server, packaged (wave86-<version>-server.zip)
        run: make server-release

      - name: Test the server's torrent reader
        run: python3 tools/test_torrentfs.py

      - uses: actions/upload-artifact@v4
        with:
          name: wave86-dos
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}     # v0.5-pre1 and the like

  picomem:
    # The EDR-DOS disk for a PicoMEM 2, built and boot-tested in dosbox-x:
    # Ubuntu 26.04's dosbox-x (2026.01.02) and mtools do it as Homebrew's do
    # on a Mac. After the dos job, so the release exists by then.
    needs: dos
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: The release's version, from the tag (v0.6 -> 0.6)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: dosbox-x and mtools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dosbox-x mtools

      - name: Open Watcom V2 (host tools for Linux)
        run: make toolchain

      - name: The EDR-DOS image, built, boot-tested and zipped (wave86-<version>-picomem-hdd.zip)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: make picomem-release

      - uses: actions/upload-artifact@v4
        with:
          name: wave86-picomem-hdd
          path: dist/*-picomem-hdd.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-picomem-hdd.zip
          prerelease: ${{ contains(github.ref_name, '-') }}

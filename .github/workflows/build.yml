name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The third-party pieces are what the repository says they are
        run: make check-third-party

      - name: Open Watcom V2 (host tools for Linux, the release the Makefile pins)
        run: make toolchain

      - name: Build the DOS side
        run: make dist

      - name: Test the server's torrent reader
        run: python3 tools/test_torrentfs.py

      - uses: actions/upload-artifact@v4
        with:
          name: wave86-dos
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

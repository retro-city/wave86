name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open Watcom V2 (host tools for Linux)
        run: |
          curl -sL -o ow.tar.xz https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p toolchain
          tar -xJf ow.tar.xz -C toolchain ./binl64 ./h ./lib286

      - name: Build the DOS side
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: wave86-dos
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

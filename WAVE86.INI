; WAVE86 configuration
; gamedir may be absolute (C:\GAMES) or relative to the launcher dir.
gamedir=C:\GAMES
; music=1 plays the soundtrack at startup (default: off, press M)
music=0
; netmusic=0 silences WAVEGET, which otherwise plays while a game comes
; in over the network (FM tracks only; the MOD mixer stays out of it)
; netmusic=1
; netcrc=0 stops WAVEGET checking each file against the server's CRC32.
; The check costs a few percent of a 486; leave it on unless you are
; counting kilobytes per second.
; netcrc=1
; netwrite=512 makes WAVEGET write at most that many bytes at a time, for a
; drive whose driver stumbles over large writes (a network or USB redirector).
; netwrite=0
; debug=1 makes the batch that runs a game stop at every step, with the
; lines it runs on the screen: the way to watch a CD being mounted.
; WAVE /debug does the same for one run.
; debug=0
theme=exodos      ; or wave86: the synthwave look
; A game with a CD image (CD\NAME.ISO in its folder, or cd= in its section)
; gets it mounted on D: while it runs: IMGMOUNT under DOSBox, otherwise
; SHSUCDHD + SHSUCDX from this folder. To use something else, $ISO is the
; image:
; cdmount=C:\UTILS\MOUNTCD.BAT $ISO
; cdunmount=C:\UTILS\UNMOUNT.BAT
; CD images kept on the server (waveserve --netdrive) are read through mTCP
; NetDrive. CONFIG.SYS: DEVICE=C:\WAVE86\NETDRIVE.SYS -d:2 (D: and E:), and
; AUTOEXEC.BAT: DRVOFF D: before anything else, so the disc can have D:
; while NetDrive uses E:. Say so here if the letter is another:
; netdrive=E
; netdrive_port=2002
; netcd=1        ; the network view starts on LOCAL CD, the disc installed with
;                ; the game; netcd=1 starts on NET CD instead (C toggles)
; Discs installed with a game (LOCAL CD) go into the game's CD\ folder unless
; cdrom_storage= names one folder for all of them: the drive a PicoGUS reads
; images from, a PicoMem 2's SD card, anywhere.
; cdrom_storage=W:
; How a game batch mounts a disc: SOFTWARE (SHSUCDHD + SHSUCDX, the default),
; or a card with its own CD-ROM emulation - a real CD-ROM drive to DOS, with
; its letter from MSCDEX at boot, so say which letter that is. The card's own
; command loads the image; the image is appended to it (cdrom_name=1 appends
; the bare file name instead of the whole path, if that is what it wants).
; imgmount=PICOGUS
; cdrom_letter=D
; cdrom_name=0
; A card takes a moment to present a disc it has just been handed, so the
; batch waits for a key after loading it; cdrom_pause=0 skips that.
; cdrom_pause=1
; PGUSINIT.EXE /cdloadname is what PICOGUS runs when this is not given
; (/cdload takes the number of an image, /cdloadname its name). A value
; here is the whole command, so put the path to your PGUSINIT in it:
; cdmount_picogus=C:\PICOGUS\PGUSINIT.EXE /cdloadname
; cdunmount_picogus=
; The PicoMem 2 has no command for loading an image yet; when it gets one:
; imgmount=PICOMEM
; cdmount_picomem=
; cdunmount_picomem=

; Games from an eXoDOS collection on your LAN: run tools/waveserve.py on
; the machine that has it, put its address here, press N in the menu.
; Needs the packet driver, MTCPCFG and DHCP from your AUTOEXEC (see README).
server=192.168.1.10:8086

; PicoGUS or any card that needs a command before certain games:
; give each mode a command, then put sound=gus (or sb, adlib...) in a
; game's section. sound= up here is the mode for games that don't say.
;soundcmd_sb=C:\PICOGUS\PGUSINIT.EXE /mode sb
;soundcmd_gus=C:\PICOGUS\PGUSINIT.EXE /mode gus
;sound=sb

; Per-game sections. Section name = game folder name. WAVE86 adds a
; section for every new folder it finds; press F2 in the menu to rename.
; Keys: name= exe= setup= args= hide=1 sound= env=VAR=value pre= post=
; source=exodos marks a game that came from the eXoDOS server (set by the
; launcher after a download; shows an eXoDOS tag in the details)


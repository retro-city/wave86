; WAVE86 configuration
; gamedir may be absolute (C:\GAMES) or relative to the launcher dir.
gamedir=C:\GAMES
; music=1 plays the soundtrack at startup (default: off, press M)
music=0

; Games from an eXoDOS collection on your LAN: run tools/waveserve.py on
; the machine that has it, put its address here, press N in the menu.
; Needs the packet driver, MTCPCFG and DHCP from your AUTOEXEC (see README).
server=192.168.1.109:8086

; PicoGUS or any card that needs a command before certain games:
; give each mode a command, then put sound=gus (or sb, adlib...) in a
; game's section. sound= up here is the mode for games that don't say.
;soundcmd_sb=C:\PICOGUS\PGUSINIT.EXE /mode sb
;soundcmd_gus=C:\PICOGUS\PGUSINIT.EXE /mode gus
;sound=sb

; Per-game sections. Section name = game folder name. WAVE86 adds a
; section for every new folder it finds; press F2 in the menu to rename.
; Keys: name= exe= setup= args= hide=1 sound= env=VAR=value pre= post=
; source=exodos marks a game that came from the eXoDOS server (set by the
; launcher after a download; shows an eXoDOS tag in the details)

[CAVES]
name=Crystal Caves

[EPICPIN]
name=Epic Pinball
exe=PINBALL.EXE


; WAVE86.INI - every setting the launcher and WAVEGET read, one per line,
; each at its default, in alphabetical order, with what it does above it.
; An update from the server (U) brings this file along as WAVE86.DEF and
; adds to your INI the settings it does not have yet, at their defaults.
; A line starting with ; is a comment; a value runs to the end of its
; line, so comments go on their own lines.

; FM music: -1 finds an AdLib or Sound Blaster by itself, 0 leaves the
; music off, 1 insists there is a card.
adlib=-1

; The command that mounts a game's disc image (cd= in its section, or
; CD\NAME.ISO in its folder) before it runs; $ISO stands for the image.
; Empty: IMGMOUNT under DOSBox, otherwise SHSUCDHD + SHSUCDX from the
; launcher's folder.
cdmount=

; With imgmount=PICOGUS, the command that loads an image into the card;
; the image is appended to it. Empty: PGUSINIT.EXE /cdloadname, which
; needs PGUSINIT on the PATH (a full path here does not).
cdmount_picogus=

; With imgmount=PICOMEM, the same for a PicoMem 2. Empty - the card has
; no DOS command for it yet - the batch names the disc, asks you to load
; it on the card, and waits for a key.
cdmount_picomem=

; The letter a card's CD-ROM drive got from MSCDEX at boot, where a game
; finds the disc it loaded.
cdrom_letter=D

; 1 hands the card the bare file name of the image instead of its whole
; path (then the batch stands in the image's folder while loading it).
cdrom_name=0

; A card takes a moment to present a disc it has just been handed, so
; the batch waits for a key after loading it; 0 skips the wait.
cdrom_pause=1

; One folder for every disc image installed from the server: the drive
; a PicoGUS reads images from, a PicoMem 2's SD card. Empty: the image
; goes into the game's own CD folder.
cdrom_storage=

; The command that takes the disc down again after the game; empty: the
; opposite of what cdmount= did.
cdunmount=

; With imgmount=PICOGUS or PICOMEM, the card's command for that; empty:
; nothing runs.
cdunmount_picogus=
cdunmount_picomem=

; 1 makes the batch that runs a game stop at every step, with the lines
; it runs on the screen: the way to watch a disc being mounted. WAVE
; /debug does the same for one run.
debug=0

; Where the games are, one folder each: a full path, or one relative to
; the launcher's folder.
gamedir=C:\GAMES

; How a game's disc is mounted: SOFTWARE (the cdmount= command, or the
; drivers above), or a card with its own CD-ROM emulation - PICOGUS, or
; PICOMEM - with its cdmount_<card>= command (or, without one, a prompt
; to load the disc on the card by hand), its cdrom_letter= drive and
; cue/bin images installed as they are, audio tracks and all. With
; WMODE=Network in the environment (the PicoMem image's Network Mode)
; SOFTWARE is used whatever this says, and discs stay on the server.
imgmount=SOFTWARE

; The MOD player's mixing rate: -1 picks one for the machine, 0 leaves
; MOD tracks out (FM tracks still play), or a rate in Hz.
modrate=-1

; 1 plays the soundtrack from the start; M turns it on and off.
music=0

; 1 lists every folder under gamedir, also one the scan finds nothing to
; run in (an empty one too): dimmed, with E to set its program. 0 leaves
; those out.
showempty=0

; The picture WAVEGET fetches with a game, from the collection's artwork,
; for the details pane: title (the title screen), gameplay, box (the box
; front), logo, disc, select, over, back, 3d. Another kind stands in when
; a game has none of that one. 0 fetches no picture.
netart=title

; Which disc the network view starts on: 0 LOCAL CD (the disc installed
; with the game), 1 NET CD (the disc stays on the server, read through
; NetDrive). C toggles it in the view.
netcd=0

; 1 has WAVEGET check every file against the server's checksum. Costs a
; few percent of a slow CPU.
netcrc=1

; The letter NetDrive got at boot (CONFIG.SYS: DEVICE=NETDRIVE.SYS -d:2
; gives it two, and DRVOFF D: in AUTOEXEC.BAT frees the first for the
; disc). Empty: found by asking NETDRIVE STATUS from D: to H:.
netdrive=

; The UDP port of the NetDrive server on the machine running waveserve.
netdrive_port=2002

; 1 plays the soundtrack while WAVEGET fetches a game (FM tracks only;
; a few percent of a slow CPU); 0 keeps the transfer quiet.
netmusic=0

; After this many seconds with nothing from the server, WAVEGET drops the
; connection of a game download and asks for the rest on a new one, in
; the same run, as many times as the new connections keep bringing
; something (on the PicoMEM a transfer can stop dead while a fresh
; connection works at once). 0 never reconnects: it waits nettimeout=
; seconds and gives up, which is what UPDATE, LIST and PLAY always do.
netreconnect=15

; 1 shows WAVEGET's transfer screen; 0 a single progress line.
netscreen=1

; How many seconds WAVEGET waits with nothing new from the server before
; it gives up - across the reconnects above, so connections that bring
; nothing end here. What arrived is kept and the next try carries on
; from there.
nettimeout=120

; Makes WAVEGET write at most this many bytes at a time, for a drive
; whose driver stumbles over large writes; 0 writes as much as it has.
netwrite=0

; The machine running tools/waveserve.py, as address:port. Empty: N in
; the menu asks for it and writes it here (:8086 added when no port is
; typed). Needs the packet driver, MTCPCFG and DHCP from AUTOEXEC.BAT
; (README).
server=

; SLOWDOWN.COM (next to the launcher; make slowdown fetches it) slows the
; machine for a game whose section says slowdown=. Its eras are its
; own model of a 486's speed: slow_pentium=, slow_486=, slow_386=,
; slow_286= and slow_xt= here replace what an era means, in SLOWDOWN's
; notation (/MHz486:66, /ATSpeed, /Percent:10...), when the presets feel
; wrong on this machine.
slow_286=/ATSpeed
slow_386=/MHz486:25
slow_486=/MHz486:66
slow_pentium=/MHz486:150
slow_xt=/XTSpeed

; 0 keeps SLOWDOWN from touching the CPU cache: needed under MS-DOS
; 6.22's HIMEM/EMM386, which crash when anything does.
slowcache=1

; 1 has SLOWDOWN pace itself off the real-time clock (INT 70h) instead of
; the timer tick: smoother at slow settings, but a game that uses the
; clock interrupt itself fights it.
slowint70=0

; The sound mode for games whose section has no sound=: its
; soundcmd_<mode>= runs before the game. Empty: nothing runs.
sound=

; A command per sound mode, for a card that needs one before certain
; games (PicoGUS: C:\PICOGUS\PGUSINIT.EXE /mode gus); a game's section
; picks a mode with sound=. Add soundcmd_<anything>= for more modes.
soundcmd_gus=
soundcmd_sb=

; The look: exodos (the eXoDOS colours), wave86 (synthwave) or picomem
; (black and gold, after the PicoMEM card, with its elephant). The
; pictures that come with games are made for it.
theme=exodos

; ---- Games. Each folder under gamedir gets a [section] named after it,
; in GAMES.INI in that folder (so the settings travel with the games; a
; section still in this file moves there the next time the launcher
; starts). The launcher adds one, with name=, for every folder it finds
; (F2 in the menu renames), and fills in exe= and source= for games it
; installs from the server - the moment the install starts, with
; netinstall=pending, netkey= (what WAVEGET asks for), netkb= (its size)
; and netexe= (the server's program, exe= once it is there);
; netinstall=done once the game is whole, and Enter on a pending game
; fetches the rest. One game, with every property a section can
; have:

;[KEEN4]
; extra command line for the program
;args=
; a disc image mounted while it runs: CD\NAME.ISO in the game's folder,
; or a full path
;cd=
; an environment variable set before it runs (repeat the line for more)
;env=
; the program that starts it, found by itself when left out (E in the
; menu sets it): a BAT named like the folder first, then RUN.BAT and the
; other start batches, then a COM or EXE named like the folder, and the
; bigger file of two; one folder down (SUB\GAME.EXE) when the folder
; itself has none, and the batch then starts it from there
;exe=KEEN4.EXE
; 1 keeps the folder out of the list
;hide=0
; extended memory the game may see, in MB (MEMLIM.EXE hides the rest
; while it runs): a game that fails with "too much" memory. 31 stays
; under the 32 MB bug some games have (Aladdin), 63 under the 64 MB one.
; O in the menu sets it; 0 or no line: all of it.
;memlimit=0
; the title shown
;name=Commander Keen 4
; a command run after the game
;post=
; a command run before it (a slowdown utility, on a fast machine)
;pre=
; its setup program, for S in the menu; found by itself when left out
; (E sets it too)
;setup=
; how fast a machine the game should think it is on (SLOWDOWN.COM runs
; while it does): pentium, 486, 386, 286 or xt - O in the menu sets it -
; or SLOWDOWN's own notation: 486:40, 286:12, 25%. No line: full speed.
;slowdown=
; its sound mode: the soundcmd_<mode>= to run first
;sound=
; where it came from: exodos or tdc; set by the launcher after an install
;source=

# mTCP settings for WAVEGET and DHCP. DHCP fills in the rest.
HOSTNAME WAVE86         ; what DHCP asks to be called: the name in your router's list of machines
MTU 1500                ; NetDrive needs at least 1200
PACKETINT 0x60, 0x65   ; the second one is for NetDrive: it takes the first while a CD image is mounted over the network
